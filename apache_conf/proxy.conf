LoadModule mpm_event_module modules/mod_mpm_event.so
LoadModule proxy_module modules/mod_proxy.so
LoadModule proxy_http_module modules/mod_proxy_http.so
LoadModule authz_core_module modules/mod_authz_core.so
LoadModule log_config_module modules/mod_log_config.so
ErrorLog /dev/null
ServerName localhost
CustomLog /dev/null common

<VirtualHost *:80>

    ServerName localhost

    # Carpeta donde están los assets de Phoenix
    DocumentRoot /var/www/architecture_a1/priv/static

    # Archivos estáticos (Phoenix no los servirá)
    Alias /uploads /var/www/architecture_a1/priv/static/uploads
    Alias /assets /var/www/architecture_a1/priv/static/assets

    <Directory /var/www/architecture_a1/priv/static>
        Options Indexes FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>
    ProxyPreserveHost On
    ProxyRequests Off
    ProxyVia On

    <Proxy *>
        Require all granted
    </Proxy>

    ProxyPass / http://app:4000/
    ProxyPassReverse / http://app:4000/
</VirtualHost>