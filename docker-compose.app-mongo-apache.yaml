services:
  app:
    container_name: architecture_a1_app
    image: web_app
    build:
      context: .
    ports:
      - "4000:4000"  # Opcional: puedes quitarlo si solo quieres acceso via proxy
    environment:
      MIX_ENV: dev
      SERVE_STATIC: "false"
      UPLOAD_PATH: "/app/priv/static/uploads"
    volumes:
      - .:/app:cached
      - deps:/app/deps
      - _build:/app/_build
    depends_on:
      - mongo
    command: mix phx.server 
 
  mongo:
    container_name: architecture_a1_mongo
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  apache:
    container_name: architecture_a1_apache
    image: httpd:2.4
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./apache/httpd.conf:/usr/local/apache2/conf/httpd.conf
      - .:/app:cached  # Compartir todo el proyecto para acceso a uploads
      #- ./apache/conf.d/:/usr/local/apache2/conf/extra/
    depends_on:
      - app
    command: ["httpd-foreground"]

volumes:
  deps:
  _build:
  mongo_data: