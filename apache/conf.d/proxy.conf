
# Configuración del proxy inverso para Phoenix app
#En teoría se usaba acá pero son tantos errores los que genera que
#mejor que no! Dejé lo necesario en httpd.conf

# Habilitar proxy
ProxyPreserveHost On
ProxyRequests Off

# Proxy hacia la aplicación Phoenix
<VirtualHost *:80>
    ServerName localhost
    
    # Proxy para WebSockets (Phoenix LiveView)
    ProxyPass /socket/ ws://app:4000/socket/
    ProxyPassReverse /socket/ ws://app:4000/socket/
    
    # Proxy principal - DEBE ir después de las rutas específicas
    ProxyPass / http://app:4000/
    ProxyPassReverse / http://app:4000/
    
    # Logs específicos para este virtual host
    ErrorLog logs/proxy_error.log
    CustomLog logs/proxy_access.log combined
</VirtualHost>